<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Administration{% endblock %} – Axians Affichage</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  <header class="appbar">
    <a href="{{ url_for('admin') }}" class="brand">
      <img src="{{ url_for('static', filename='img/axians-logo-white.svg') }}" alt="Axians">
      <span>Affichage dynamique</span>
    </a>
    {% if session.admin %}
    <nav>
      <a href="{{ url_for('admin') }}">Contenus</a>
      <a href="{{ url_for('logout') }}">Déconnexion</a>
      <a href="{{ url_for('display') }}" target="_blank" rel="noopener" class="cta">Voir l'écran ↗</a>
    </nav>
    {% endif %}
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Menu « Nouveau contenu » : se ferme au clic à l'extérieur ou avec Échap
    document.addEventListener('click', (e) => {
      document.querySelectorAll('details.new-content[open]').forEach((d) => { if (!d.contains(e.target)) d.open = false; });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.querySelectorAll('details.new-content[open]').forEach((d) => { d.open = false; });
    });
    // Confirmation en deux clics, dans la page : fonctionne même dans les navigateurs qui
    // bloquent les boîtes de dialogue (confirm() renvoie alors « Annuler » sans rien afficher).
    document.addEventListener('submit', (e) => {
      const form = e.target;
      if (!form.dataset.confirm || form.dataset.armed === '1') return;   // 2e clic : on laisse passer
      e.preventDefault();
      const btn = form.querySelector('button');
      const original = btn.innerHTML;
      form.dataset.armed = '1';
      btn.classList.add('btn-confirm');
      btn.textContent = form.dataset.confirm;
      clearTimeout(form._disarm);
      form._disarm = setTimeout(() => {
        form.dataset.armed = '';
        btn.innerHTML = original;
        btn.classList.remove('btn-confirm');
      }, 6000);
    });
  </script>
</body>
</html>
